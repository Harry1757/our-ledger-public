<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">우리 가계부 · 함께 쓴 돈도, 내가 쓴 돈도.</title>
  <desc id="desc">iPhone과 PC에서 공용·개인 기록과 생활비 정산을 관리하는 개인 프로젝트</desc>
  <rect width="1280" height="360" rx="28" fill="#fff7ed"/>
  <rect x="50" y="44" width="48" height="48" rx="15" fill="#f76707"/>
  <path d="M62 58q7-4 12 0q5-4 12 0v20q-7-4-12 0q-5-4-12 0zm12 0v20" fill="none" stroke="white" stroke-width="2.4" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="114" y="76" font-size="24" font-weight="700" fill="#a63c06">OUR LEDGER</text>
    <text x="50" y="169" font-size="56" font-weight="800" letter-spacing="-2" fill="#252321">함께 쓴 돈도, 내가 쓴 돈도.</text>
    <text x="52" y="221" font-size="24" fill="#75675c">iPhone과 PC에서 이어지는 생활비 기록과 정산</text>
    <g font-size="17" font-weight="600" fill="#705342">
      <rect x="50" y="269" width="98" height="39" rx="19.5" fill="#ffead8"/><text x="99" y="295" text-anchor="middle">SwiftUI</text>
      <rect x="158" y="269" width="88" height="39" rx="19.5" fill="#ffead8"/><text x="202" y="295" text-anchor="middle">React</text>
      <rect x="256" y="269" width="96" height="39" rx="19.5" fill="#ffead8"/><text x="304" y="295" text-anchor="middle">Python</text>
      <rect x="362" y="269" width="126" height="39" rx="19.5" fill="#ffead8"/><text x="425" y="295" text-anchor="middle">Firestore</text>
    </g>
    <rect x="930" y="60" width="298" height="240" rx="24" fill="white" stroke="#ffe1c7"/>
    <text x="958" y="105" font-size="16" fill="#87776b">기록은 가볍게, 공유는 명확하게.</text>
    <g font-size="22" font-weight="700" fill="#37312c">
      <circle cx="971" cy="153" r="13" fill="#fff0e2"/><path d="m965 153 4 4 8-9" fill="none" stroke="#e65e09" stroke-width="2.5"/><text x="999" y="161">공용은 함께</text>
      <circle cx="971" cy="204" r="13" fill="#fff0e2"/><path d="m965 204 4 4 8-9" fill="none" stroke="#e65e09" stroke-width="2.5"/><text x="999" y="212">개인은 나만</text>
      <circle cx="971" cy="255" r="13" fill="#fff0e2"/><path d="m965 255 4 4 8-9" fill="none" stroke="#e65e09" stroke-width="2.5"/><text x="999" y="263">정산은 확인 후</text>
    </g>
  </g>
</svg>
